<div class="auth-layout">
  <div class="auth-layout__card">
    <h2 class="auth-layout__title">إعادة تعيين كلمة المرور</h2>
    <p class="auth-layout__subtitle">سنرسل لك رابط إعادة التعيين 📧</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input
          type="email"
          formControlName="email"
          placeholder="example@email.com"
        />
        @if (form.get("email")?.touched && form.get("email")?.invalid) {
          <div class="alert alert--error">يرجى إدخال بريد إلكتروني صحيح</div>
        }
      </div>

      @if (message) {
        <div class="alert alert--success">{{ message }}</div>
      }

      @if (error) {
        <div class="alert alert--error">{{ error }}</div>
      }

      <div class="auth-layout__actions">
        <button
          type="submit"
          class="btn btn--primary btn--block"
          [disabled]="form.invalid || loading"
        >
          إرسال رابط التعيين
        </button>
      </div>
    </form>
  </div>
</div>
