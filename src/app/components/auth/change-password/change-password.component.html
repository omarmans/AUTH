<div class="auth-layout">
  <div class="auth-layout__card">
    <h2 class="auth-layout__title">تغيير كلمة المرور</h2>
    <p class="auth-layout__subtitle">اختر كلمة مرور قوية 🔒</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>كلمة المرور الجديدة</label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
        />
        @if (form.get("password")?.touched && form.get("password")?.invalid) {
          <div class="alert alert--error">
            كلمة المرور يجب أن تكون 6 أحرف على الأقل
          </div>
        }
      </div>

      <div class="form-group">
        <label>تأكيد كلمة المرور</label>
        <input
          type="password"
          formControlName="confirmPassword"
          placeholder="••••••••"
        />
        @if (form.errors?.["notMatch"]) {
          <div class="alert alert--error">كلمتا المرور غير متطابقتين</div>
        }
      </div>

      @if (message) {
        <div class="alert alert--success">{{ message }}</div>
      }

      @if (error) {
        <div class="alert alert--error">{{ error }}</div>
      }

      <div class="auth-layout__actions">
        <button
          type="submit"
          class="btn btn--primary btn--block"
          [disabled]="form.invalid || loading"
        >
          تحديث كلمة المرور
        </button>
      </div>
    </form>
  </div>
</div>
